<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projectes · ERD</title>
  <meta name="description" content="Empreses reals, reptes reals. Així hem ajudat altres negocis com el teu.">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script defer src="/assets/js/vendor/gsap.min.js"></script>
  <script defer src="/assets/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/assets/js/vendor/SplitText.min.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body class="bg-erd-flour font-body text-body-mobile text-erd-cacao lg:text-body">
  <a class="sr-only focus:not-sr-only" href="#contingut">Salta al contingut</a>

  <site-header class="block"></site-header>

  <main id="contingut">
    <section class="page-hero">
      <div class="page-hero-art" data-animacion="fade">
        <video src="/assets/video/hero-lines.mp4" width="3840" height="360" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true" data-video-lento></video>
      </div>
      <div class="wrap">
        <h1 class="title-1" data-titulo-palabras>Projectes</h1>
      </div>
    </section>

    <section class="wrap pt-6 lg:pt-10" data-animacion="arriba">
      <p class="lead">Empreses reals, reptes reals. Així hem ajudat altres negocis com el teu.</p>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="filters" role="group" aria-label="Sectors" data-filtres>
          <button class="filter-chip" type="button" data-filtre="" aria-pressed="true">Tots</button>
          <button class="filter-chip" type="button" data-filtre="Logística" aria-pressed="false">Logística</button>
          <button class="filter-chip" type="button" data-filtre="Indústria" aria-pressed="false">Indústria</button>
          <button class="filter-chip" type="button" data-filtre="Restauració" aria-pressed="false">Restauració</button>
          <button class="filter-chip" type="button" data-filtre="Finances" aria-pressed="false">Finances</button>
          <button class="filter-chip" type="button" data-filtre="Comercial" aria-pressed="false">Comercial</button>
          <button class="filter-chip" type="button" data-filtre="Compravenda" aria-pressed="false">Compravenda</button>
        </div>
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" data-projectes></div>
        <p class="lead" data-projectes-buit hidden>Ara mateix no hi ha projectes per mostrar.</p>
        <template data-plantilla-projecte>
          <article class="project-card" data-animacion="arriba">
            <div class="project-card-image">
              <img data-campo="imatge" alt="" width="1600" height="900" loading="lazy">
            </div>
            <span class="chip chip-sand" data-campo="sector"></span>
            <h3 data-campo="titol"></h3>
            <p data-campo="resum"></p>
            <a class="more-link" data-campo="enlace" href="/projectes/">Veure el projecte <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
          </article>
        </template>
      </div>
    </section>
  </main>

  <site-contact class="block"></site-contact>
  <site-footer class="block"></site-footer>
</body>
</html>
