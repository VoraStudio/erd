<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projecte · ERD</title>
  <meta name="description" content="Explicació breu del projecte i del tipus d'empresa.">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script defer src="/assets/js/vendor/gsap.min.js"></script>
  <script defer src="/assets/js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="/assets/js/vendor/SplitText.min.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body class="bg-erd-flour font-body text-body-mobile text-erd-cacao lg:text-body">
  <a class="sr-only focus:not-sr-only" href="#contingut">Salta al contingut</a>

  <site-header class="block"></site-header>

  <main id="contingut" data-cms-pendiente>
    <section class="wrap" data-projecte-detall hidden>
      <nav class="crumbs" aria-label="Camí de navegació" data-animacion="fade">
        <a href="/projectes/">Projectes</a> <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"></path></svg>
        <span aria-current="page" data-campo="titol"></span>
      </nav>
      <div class="detail-top">
        <div>
          <span class="chip" data-animacion="arriba" data-campo="sector"></span>
          <h1 class="title-1 mt-4" data-titulo-palabras data-campo="titol"></h1>
          <p class="lead mt-4" data-lineas data-espera="0.35" data-campo="resum"></p>
        </div>
        <ol class="steps-list">
          <li data-animacion="derecha">
            <span class="step-arrow" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            <div>
              <b>El repte</b>
              <p data-lineas data-espera="0.3" data-campo="repte"></p>
            </div>
          </li>
          <li data-animacion="derecha">
            <span class="step-arrow" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            <div>
              <b>Què vam fer</b>
              <p data-lineas data-espera="0.3" data-campo="que_vam_fer"></p>
            </div>
          </li>
          <li data-animacion="derecha">
            <span class="step-arrow" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            <div>
              <b>El resultat</b>
              <p data-lineas data-espera="0.3" data-campo="resultat"></p>
            </div>
          </li>
        </ol>
      </div>
      <div class="figure-grid" data-recuadres></div>
      <div class="detail-images" data-imatges></div>
      <div class="detail-next">
        <a class="btn btn-line" href="/projectes/">Tots els projectes<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
      </div>
    </section>
    <section class="wrap pt-10 lg:pt-18" data-projecte-error hidden>
      <p class="lead">No hem trobat aquest projecte.</p>
      <div class="detail-next">
        <a class="btn btn-line" href="/projectes/">Tots els projectes<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
      </div>
    </section>
    <template data-plantilla-recuadre>
      <div class="figure-card" data-animacion="arriba">
        <b data-campo="valor" data-cifra></b>
        <span data-campo="text"></span>
      </div>
    </template>
    <template data-plantilla-imatge>
      <div data-cortina-lateral>
        <img data-campo="imatge" alt="" width="1600" height="900" loading="lazy">
      </div>
    </template>
  </main>

  <site-contact class="block"></site-contact>
  <site-footer class="block"></site-footer>
</body>
</html>
