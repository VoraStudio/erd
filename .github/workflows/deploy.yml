name: Compilar y desplegar en el hosting (FTPS)

# Cada push a main comprueba el código, compila el CSS y despliega en producción;
# el botón de la pestaña Actions lo ejecuta a mano.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El CSS compilado no está en git: se genera aquí.
      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el CSS
        run: npm run build

      # Falla pronto si la compilación no ha generado la hoja de estilos que enlazan las páginas.
      - name: Comprobar el resultado de la compilación
        run: test -s public/assets/css/styles.css

      # PHP viene preinstalado en el ejecutor de GitHub.
      - name: Comprobar la sintaxis de PHP
        run: |
          php -v
          find public src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Ejecutar las pruebas de PHP
        run: php tests/run.php

      # Primero se sube src/ (a la carpeta superior de la web, fuera de la carpeta pública) y después
      # public/ (a FTP_REMOTE_DIR): si falla la primera subida, la web no queda a medias. Sin --delete: los archivos que solo existen en el servidor (el .env) no se
      # tocan. Los restos de páginas renombradas hay que borrarlos a mano.
      # El certificado se verifica (es lo habitual); solo se relaja si el hosting lo exige.
      # Mientras la portada pública sea «Properament», no se suben el borrador (index-v2.html) ni el
      # formulario (contact.php). Al lanzar: index-v2.html pasa a ser index.html y se quitan estas exclusiones.
      - name: Subir al hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          DIRECTORIO_SUPERIOR=$(dirname "$FTP_REMOTE_DIR")
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          cd $DIRECTORIO_SUPERIOR
          mirror --reverse --verbose --parallel=1 --exclude-glob .DS_Store src src
          cd $FTP_REMOTE_DIR
          mirror --reverse --verbose --parallel=1 --exclude-glob .DS_Store --exclude-glob index-v2.html --exclude-glob contact.php public .
          EOF
